# Fichier de configuration par défaut — OptoBind-AI
# Copier ce fichier et adapter les valeurs pour chaque expérience.

# ─────────────────────────────────────────────────────────────────────────────
# Fichiers d'entrée (Target & Ligand)
# ─────────────────────────────────────────────────────────────────────────────
inputs:
  target      : "inputs/targets/zn2+_site.pdb"   # Cible (ex: ion Zn²⁺ ou poche)
  ligand      : "inputs/ligands/DFHBI-1T.sdf"    # Fluorophore (ex: DFHBI-1T)

# ─────────────────────────────────────────────────────────────────────────────
# Paramètres globaux de design
# ─────────────────────────────────────────────────────────────────────────────
design:
  n_variants  : 2         # Nombre de variants à générer (1–50, 2 pour test CPU rapide)
  min_length  : 70        # Longueur minimale du squelette (en AA)
  max_length  : 100       # Longueur maximale du squelette (en AA)
  pH          : 7.4       # pH cible (impact sur protonation des His)

# ─────────────────────────────────────────────────────────────────────────────
# Module 1 — RFdiffusion All-Atom
# ─────────────────────────────────────────────────────────────────────────────
rfdiffusion:
  model_weights     : "weights/RFDiffusionAA_paper_weights.pt"
  num_steps         : 25           # Nombre de pas de diffusion (25 pour CPU rapide, 200 sur GPU)
  noise_scale_ca    : 1.0
  noise_scale_frame : 1.0
  # Contigs : format RFdiffusion All-Atom — segments séparés par des virgules
  # "A1-1,70-100" = conserver résidu A1 (site de liaison), halluciner 70-100 AA de novo
  contigs           : "A1-1,70-100"
  # Résidus chauds (hotspots) imposant la poche de liaison (ex: A12+A34)
  hotspot_residues  : []
  use_cuda          : true
  seed              : 42

# ─────────────────────────────────────────────────────────────────────────────
# Module 2 — ProteinMPNN
# ─────────────────────────────────────────────────────────────────────────────
proteinmpnn:
  model_weights     : "weights/ProteinMPNN_v_48_020.pt"
  # Température d'échantillonnage : 0.1 (conservateur) à 0.5 (diversité)
  sampling_temp     : 0.1
  num_seq_per_target: 8            # Séquences générées par squelette
  backbone_noise    : 0.00         # Bruit ajouté au squelette (Å)
  use_cuda          : true
  seed              : 42

# ─────────────────────────────────────────────────────────────────────────────
# Module 3 — Validation structurale
# ─────────────────────────────────────────────────────────────────────────────
alphafold:
  # backend : "chai-1" | "esmfold" | "alphafold3"
  backend           : "chai-1"
  model_dir         : "weights/chai-1/"
  num_trunk_recycles: 3
  num_diffn_samples : 5
  use_esm_embeddings: true
  use_cuda          : true

# ─────────────────────────────────────────────────────────────────────────────
# Critères de validation in silico
# ─────────────────────────────────────────────────────────────────────────────
validation:
  rmsd_threshold    : 2.0    # Seuil RMSD Cα (Å) — doit être < ce seuil
  plddt_threshold   : 90.0   # pLDDT moyen requis (sur 100)
  clash_vdw_cutoff  : 0.6    # Fraction du rayon VdW pour détecter un clash
